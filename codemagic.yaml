workflows:
  android-debug:
    name: LiveTV Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        LIVE_TV_BASE_URL: "https://sojib247.iceiy.com/"
    scripts:
      - name: Check Android project
        script: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Validate secret API key
        script: |
          test -n "$LIVE_TV_API_KEY" || { echo "LIVE_TV_API_KEY is missing. Add it as a Secret environment variable in Codemagic."; exit 1; }
      - name: Build debug APK
        script: |
          gradle --no-daemon --stacktrace assembleDebug \
            -PLIVE_TV_BASE_URL="$LIVE_TV_BASE_URL" \
            -PLIVE_TV_API_KEY="$LIVE_TV_API_KEY"
    artifacts:
      - app/build/outputs/apk/debug/*.apk
