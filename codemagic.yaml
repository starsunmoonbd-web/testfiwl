workflows:
  android-debug:
    name: LiveTV Android APK
    max_build_duration: 60

    environment:
      groups:
        - livetv_secrets
      vars:
        LIVE_TV_BASE_URL: "https://sojib247.iceiy.com/"

    scripts:
      - name: Check API configuration
        script: |
          if [ -z "$LIVE_TV_API_KEY" ]; then
            echo "ERROR: LIVE_TV_API_KEY is missing"
            exit 1
          fi

          echo "API key detected."
          echo "Base URL: $LIVE_TV_BASE_URL"

      - name: Check Android project
        script: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Android project found."

      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew

      - name: Clean project
        script: |
          ./gradlew --no-daemon clean

      - name: Build Debug APK
        script: |
          ./gradlew --no-daemon --stacktrace assembleDebug \
            -PLIVE_TV_BASE_URL="$LIVE_TV_BASE_URL" \
            -PLIVE_TV_API_KEY="$LIVE_TV_API_KEY"

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - YOUR_EMAIL@example.com
        notify:
          success: true
          failure: true
