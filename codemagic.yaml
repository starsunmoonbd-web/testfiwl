workflows:
  android-debug:
    name: LiveTV Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        LIVE_TV_BASE_URL: https://sojib247.iceiy.com/
      groups:
        - livetv_secrets

    scripts:

      - name: Extract Android Project
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          echo "=========================================="
          echo "Extracting Android project"
          echo "=========================================="

          if [ -f "settings.gradle.kts" ]; then
            echo "Project already at root."
          else
            ZIP_FILE=$(ls *.zip | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: ZIP file not found."
              exit 1
            fi

            echo "ZIP: $ZIP_FILE"

            rm -rf builder
            mkdir -p builder

            unzip -q "$ZIP_FILE" -d builder

            echo "ZIP extracted."
          fi

          echo "Checking project..."

          if [ -f "$CM_BUILD_DIR/settings.gradle.kts" ]; then
            echo "Using root project."
          elif [ -f "$CM_BUILD_DIR/builder/settings.gradle.kts" ]; then
            echo "Using builder project."
          else
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi


      - name: Configure Project
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$CM_BUILD_DIR"
          else
            PROJECT_DIR="$CM_BUILD_DIR/builder"
          fi

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "Project configured."


      - name: Check API Key
        script: |
          set -e

          echo "=========================================="
          echo "Checking API configuration"
          echo "=========================================="

          if [ -z "$LIVE_TV_API_KEY" ]; then
            echo "ERROR: LIVE_TV_API_KEY is missing."
            echo "Check variable group: livetv_secrets"
            exit 1
          fi

          echo "Base URL:"
          echo "$LIVE_TV_BASE_URL"

          echo "API key: configured"


      - name: Prepare Gradle
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$CM_BUILD_DIR"
          else
            PROJECT_DIR="$CM_BUILD_DIR/builder"
          fi

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Preparing Gradle"
          echo "=========================================="

          if [ ! -f "./gradlew" ]; then
            echo "Creating Gradle wrapper..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."

          ./gradlew --version


      - name: Clean Project
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$CM_BUILD_DIR"
          else
            PROJECT_DIR="$CM_BUILD_DIR/builder"
          fi

          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          ./gradlew clean --no-daemon


      - name: Build Debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$CM_BUILD_DIR"
          else
            PROJECT_DIR="$CM_BUILD_DIR/builder"
          fi

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Building LiveTV APK"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            -PLIVE_TV_BASE_URL="$LIVE_TV_BASE_URL" \
            -PLIVE_TV_API_KEY="$LIVE_TV_API_KEY"

          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="


      - name: Verify APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$CM_BUILD_DIR"
          else
            PROJECT_DIR="$CM_BUILD_DIR/builder"
          fi

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          APK_FILE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            echo "Searching for APK files..."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          ls -lh "$APK_FILE"

          echo "APK verification successful."


    artifacts:
      - "**/app/build/outputs/apk/debug/*.apk"
