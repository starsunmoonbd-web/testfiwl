workflows:
  android-debug:
    name: LiveTV Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        LIVE_TV_BASE_URL: "https://sojib247.iceiy.com/"
      groups:
        - livetv_secrets

    scripts:

      - name: Prepare Android project
        script: |
          set -e

          echo "=========================================="
          echo "Preparing Android project..."
          echo "=========================================="

          cd "$CM_BUILD_DIR"

          # Check if Android project is already at repository root
          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
              echo "Android project found at repository root."
              export FINAL_PROJECT_DIR="$CM_BUILD_DIR"

          else
              echo "Android project not at repository root."

              # Find ZIP file
              ZIP_FILE=""

              for f in "$CM_BUILD_DIR"/*.zip; do
                  if [ -f "$f" ]; then
                      ZIP_FILE="$f"
                      break
                  fi
              done

              if [ -z "$ZIP_FILE" ]; then
                  echo "ERROR: No ZIP file found."
                  exit 1
              fi

              echo "ZIP found:"
              echo "$ZIP_FILE"

              # Clean old extraction directory
              rm -rf "$CM_BUILD_DIR/builder"

              mkdir -p "$CM_BUILD_DIR/builder"

              echo "Extracting ZIP..."

              unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/builder"

              echo "ZIP extracted."

              # Your current ZIP has the Android project directly inside builder
              if [ -f "$CM_BUILD_DIR/builder/settings.gradle.kts" ] && [ -d "$CM_BUILD_DIR/builder/app" ]; then
                  export FINAL_PROJECT_DIR="$CM_BUILD_DIR/builder"

              elif [ -f "$CM_BUILD_DIR/builder/settings.gradle" ] && [ -d "$CM_BUILD_DIR/builder/app" ]; then
                  export FINAL_PROJECT_DIR="$CM_BUILD_DIR/builder"

              else
                  echo "Android project not directly inside builder."
                  echo "Searching one level deeper..."

                  FINAL_PROJECT_DIR=""

                  for d in "$CM_BUILD_DIR/builder"/*; do
                      if [ -d "$d" ] && [ -d "$d/app" ]; then

                          if [ -f "$d/settings.gradle.kts" ] || [ -f "$d/settings.gradle" ]; then
                              FINAL_PROJECT_DIR="$d"
                              break
                          fi

                      fi
                  done

                  if [ -z "$FINAL_PROJECT_DIR" ]; then
                      echo "ERROR: Android project not found."

                      echo ""
                      echo "Extracted files:"
                      find "$CM_BUILD_DIR/builder" -maxdepth 4 -type f -print

                      exit 1
                  fi
              fi
          fi

          echo ""
          echo "=========================================="
          echo "Android project:"
          echo "$FINAL_PROJECT_DIR"
          echo "=========================================="

          test -d "$FINAL_PROJECT_DIR/app"
          test -f "$FINAL_PROJECT_DIR/app/build.gradle.kts" || \
          test -f "$FINAL_PROJECT_DIR/app/build.gradle"

          echo "Android project check PASSED."


      - name: Configure Android SDK
        script: |
          set -e

          echo "=========================================="
          echo "Configuring Android SDK..."
          echo "=========================================="

          cd "$FINAL_PROJECT_DIR"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          cat local.properties

          echo "Android SDK configured."


      - name: Check API key
        script: |
          set -e

          echo "=========================================="
          echo "Checking API configuration..."
          echo "=========================================="

          if [ -z "$LIVE_TV_API_KEY" ]; then
              echo "ERROR: LIVE_TV_API_KEY is missing."
              echo ""
              echo "Make sure Codemagic variable group is:"
              echo "livetv_secrets"
              echo ""
              echo "And it contains:"
              echo "LIVE_TV_API_KEY"
              exit 1
          fi

          echo "API key is configured."

          echo ""
          echo "API Base URL:"
          echo "$LIVE_TV_BASE_URL"

          echo ""
          echo "API key:"
          echo "Configured (hidden)"

          echo ""
          echo "API configuration check PASSED."


      - name: Make Gradle executable
        script: |
          set -e

          cd "$FINAL_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              echo "Gradle wrapper found."
          else
              echo "Gradle wrapper not found."
              echo "Using system Gradle."
          fi


      - name: Build Debug APK
        script: |
          set -e

          cd "$FINAL_PROJECT_DIR"

          echo "=========================================="
          echo "Building LiveTV APK..."
          echo "=========================================="

          if [ -f "./gradlew" ]; then

              ./gradlew \
                --no-daemon \
                --stacktrace \
                assembleDebug \
                -PLIVE_TV_BASE_URL="$LIVE_TV_BASE_URL" \
                -PLIVE_TV_API_KEY="$LIVE_TV_API_KEY"

          else

              gradle \
                --no-daemon \
                --stacktrace \
                assembleDebug \
                -PLIVE_TV_BASE_URL="$LIVE_TV_BASE_URL" \
                -PLIVE_TV_API_KEY="$LIVE_TV_API_KEY"

          fi

          echo ""
          echo "=========================================="
          echo "Build completed."
          echo "=========================================="


      - name: Verify APK
        script: |
          set -e

          echo "=========================================="
          echo "Checking generated APK..."
          echo "=========================================="

          if [ -f "$FINAL_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" ]; then

              echo "APK FOUND:"
              echo "$FINAL_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

              ls -lh "$FINAL_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          else

              echo "ERROR: APK was not generated."

              echo ""
              echo "Searching build output..."

              find "$FINAL_PROJECT_DIR/app/build" -type f -name "*.apk" -print || true

              exit 1
          fi

          echo ""
          echo "APK verification PASSED."


    artifacts:
      - "**/app/build/outputs/apk/debug/*.apk"
