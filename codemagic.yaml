workflows:
  android-debug:
    name: LiveTV Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        LIVE_TV_BASE_URL: "https://sojib247.iceiy.com/"
      groups:
        - livetv_secrets

    scripts:

      # ============================================================
      # 1. FIND / EXTRACT PROJECT
      # ============================================================

      - name: Find and Extract Android Project
        script: |
          set -e

          echo "=========================================="
          echo "Searching for Android project..."
          echo "=========================================="

          cd "$CM_BUILD_DIR"

          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then

              echo "Android project found at repository root."

              FINAL_PROJECT_DIR="$CM_BUILD_DIR"

          else

              echo "Android project not at repository root."
              echo "Searching for ZIP..."

              ZIP_FILE=""

              for FILE in "$CM_BUILD_DIR"/*.zip; do
                  if [ -f "$FILE" ]; then
                      ZIP_FILE="$FILE"
                      break
                  fi
              done

              if [ -z "$ZIP_FILE" ]; then
                  echo "ERROR: No ZIP file found."
                  exit 1
              fi

              echo "ZIP found:"
              echo "$ZIP_FILE"

              rm -rf "$CM_BUILD_DIR/builder"
              mkdir -p "$CM_BUILD_DIR/builder"

              echo "Extracting ZIP..."

              unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/builder"

              echo "ZIP extracted."

              # Your current ZIP structure is:
              #
              # builder/
              # ├── settings.gradle.kts
              # ├── build.gradle.kts
              # ├── app/
              #
              if [ -f "$CM_BUILD_DIR/builder/settings.gradle.kts" ] && \
                 [ -d "$CM_BUILD_DIR/builder/app" ]; then

                  FINAL_PROJECT_DIR="$CM_BUILD_DIR/builder"

              elif [ -f "$CM_BUILD_DIR/builder/settings.gradle" ] && \
                   [ -d "$CM_BUILD_DIR/builder/app" ]; then

                  FINAL_PROJECT_DIR="$CM_BUILD_DIR/builder"

              else

                  echo "Searching inside extracted directory..."

                  FINAL_PROJECT_DIR=""

                  for DIR in "$CM_BUILD_DIR"/builder/*; do

                      if [ -d "$DIR/app" ]; then

                          if [ -f "$DIR/settings.gradle.kts" ] || \
                             [ -f "$DIR/settings.gradle" ]; then

                              FINAL_PROJECT_DIR="$DIR"
                              break

                          fi

                      fi

                  done

              fi

              if [ -z "$FINAL_PROJECT_DIR" ]; then

                  echo "ERROR: Android project not found."

                  echo ""
                  echo "Extracted files:"

                  find "$CM_BUILD_DIR/builder" \
                    -maxdepth 5 \
                    -type f \
                    -print

                  exit 1
              fi

          fi

          echo ""
          echo "=========================================="
          echo "Android project found:"
          echo "$FINAL_PROJECT_DIR"
          echo "=========================================="

          test -f "$FINAL_PROJECT_DIR/settings.gradle.kts" || \
          test -f "$FINAL_PROJECT_DIR/settings.gradle"

          test -d "$FINAL_PROJECT_DIR/app"

          test -f "$FINAL_PROJECT_DIR/app/build.gradle.kts" || \
          test -f "$FINAL_PROJECT_DIR/app/build.gradle"

          echo "Android project check PASSED."


      # ============================================================
      # 2. ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        script: |
          set -e

          cd "$FINAL_PROJECT_DIR"

          echo "=========================================="
          echo "Configuring Android SDK..."
          echo "=========================================="

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          cat local.properties

          echo "Android SDK configured."


      # ============================================================
      # 3. API KEY
      # ============================================================

      - name: Check API Configuration
        script: |
          set -e

          echo "=========================================="
          echo "Checking API configuration..."
          echo "=========================================="

          if [ -z "$LIVE_TV_API_KEY" ]; then

              echo "ERROR: LIVE_TV_API_KEY is missing."
              echo ""
              echo "Codemagic Variable Group:"
              echo "livetv_secrets"
              echo ""
              echo "Required Secret:"
              echo "LIVE_TV_API_KEY"

              exit 1
          fi

          echo "LIVE_TV_BASE_URL:"
          echo "$LIVE_TV_BASE_URL"

          echo ""
          echo "LIVE_TV_API_KEY:"
          echo "Configured (hidden)"

          echo ""
          echo "API configuration PASSED."


      # ============================================================
      # 4. JAVA CHECK
      # ============================================================

      - name: Check Java Version
        script: |
          set -e

          echo "=========================================="
          echo "Checking Java..."
          echo "=========================================="

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Java check completed."


      # ============================================================
      # 5. CREATE GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle 8.9
        script: |
          set -e

          cd "$FINAL_PROJECT_DIR"

          echo "=========================================="
          echo "Preparing Gradle 8.9..."
          echo "=========================================="

          if [ -f "./gradlew" ]; then

              echo "Gradle wrapper already exists."

              chmod +x ./gradlew

          else

              echo "Gradle wrapper not found."
              echo "Creating Gradle 8.9 wrapper..."

              gradle wrapper --gradle-version 8.9

              chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle version:"

          ./gradlew --version

          echo ""
          echo "Gradle preparation PASSED."


      # ============================================================
      # 6. CLEAN
      # ============================================================

      - name: Clean Android Project
        script: |
          set -e

          cd "$FINAL_PROJECT_DIR"

          echo "=========================================="
          echo "Cleaning project..."
          echo "=========================================="

          ./gradlew clean --no-daemon

          echo "Clean completed."


      # ============================================================
      # 7. BUILD
      # ============================================================

      - name: Build Debug APK
        script: |
          set -e

          cd "$FINAL_PROJECT_DIR"

          echo "=========================================="
          echo "Building LiveTV Debug APK..."
          echo "=========================================="

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Starting build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug \
            -PLIVE_TV_BASE_URL="$LIVE_TV_BASE_URL" \
            -PLIVE_TV_API_KEY="$LIVE_TV_API_KEY"

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="


      # ============================================================
      # 8. VERIFY APK
      # ============================================================

      - name: Verify APK
        script: |
          set -e

          echo "=========================================="
          echo "Verifying APK..."
          echo "=========================================="

          APK="$FINAL_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

              echo "ERROR: APK was not generated."

              echo ""
              echo "Searching for APK files..."

              find "$FINAL_PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                -print

              exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

          echo ""
          echo "APK verification PASSED."


    # ================================================================
    # ARTIFACT
    # ================================================================

    artifacts:
      - "**/app/build/outputs/apk/debug/*.apk"
